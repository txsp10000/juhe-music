name: iOS build

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee ../pod-install.log

      - name: Report CocoaPods failure
        if: failure()
        run: |
          if [ -f pod-install.log ]; then
            error_text=$(grep -E -A 12 -B 3 '\[!\]|[Ee]rror|Exception' pod-install.log | tail -80 || tail -80 pod-install.log)
            echo "## CocoaPods error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$error_text" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            error_text=${error_text//'%'/'%25'}
            error_text=${error_text//$'\r'/'%0D'}
            error_text=${error_text//$'\n'/'%0A'}
            echo "::error title=CocoaPods install failed::$error_text"
          fi

      - name: Build unsigned iOS release
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" 2>&1 | tee ios-build.log

      - name: Sign TrollStore CarPlay app
        run: |
          set -euo pipefail
          app_path=$(find build/ios -type d -name Runner.app -path '*iphoneos*' -print -quit)
          if [ -z "$app_path" ]; then
            echo "Runner.app was not found after the iOS build" >&2
            exit 1
          fi

          while IFS= read -r -d '' component; do
            codesign --force --sign - "$component"
          done < <(find "$app_path" -depth \
            \( -type d \( -name '*.framework' -o -name '*.appex' \) \
            -o -type f -name '*.dylib' \) -print0)

          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          mkdir -p build/ios/ipa
          codesign -d --entitlements :- "$app_path" \
            > build/ios/ipa/embedded-entitlements.plist
          carplay_enabled=$(/usr/libexec/PlistBuddy \
            -c 'Print :SBStarkCapable' \
            build/ios/ipa/embedded-entitlements.plist)
          if [ "$carplay_enabled" != "true" ]; then
            echo "TrollStore CarPlay entitlement is missing from Runner.app" >&2
            exit 1
          fi

      - name: Package CarPlay IPA
        run: |
          set -euo pipefail
          app_path=$(find build/ios -type d -name Runner.app -path '*iphoneos*' -print -quit)
          if [ -z "$app_path" ]; then
            echo "Runner.app was not found after the iOS build" >&2
            exit 1
          fi
          mkdir -p build/ios/ipa/Payload
          ditto "$app_path" build/ios/ipa/Payload/Runner.app
          ipa_name="JuheMusic-iOS-CarPlay-TrollStore-${GITHUB_RUN_NUMBER}.ipa"
          (cd build/ios/ipa && zip -qry "$ipa_name" Payload)
          rm -rf build/ios/ipa/Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: JuheMusic-iOS-CarPlay-TrollStore-${{ github.run_number }}
          path: |
            build/ios/ipa/JuheMusic-iOS-CarPlay-TrollStore-${{ github.run_number }}.ipa
            build/ios/ipa/embedded-entitlements.plist
          if-no-files-found: error
          retention-days: 30

      - name: Report iOS build failure
        if: failure()
        run: |
          if [ -f ios-build.log ]; then
            error_text=$(grep -E -A 12 -B 3 'error:|Error|Exception|BUILD FAILED|Failed to build' ios-build.log | tail -120 || tail -120 ios-build.log)
            echo "## iOS build error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$error_text" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            error_text=${error_text//'%'/'%25'}
            error_text=${error_text//$'\r'/'%0D'}
            error_text=${error_text//$'\n'/'%0A'}
            echo "::error title=iOS release build failed::$error_text"
          fi

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download iOS build
        uses: actions/download-artifact@v4
        with:
          name: JuheMusic-iOS-CarPlay-TrollStore-${{ github.run_number }}
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Juhe Music iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated TrollStore iOS build for ${GITHUB_SHA}." \
            --latest \
            release/*.ipa release/embedded-entitlements.plist
