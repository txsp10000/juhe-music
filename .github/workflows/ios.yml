name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee ../pod-install.log

      - name: Report CocoaPods failure
        if: failure()
        run: |
          if [ -f pod-install.log ]; then
            error_text=$(grep -E -A 12 -B 3 '\[!\]|[Ee]rror|Exception' pod-install.log | tail -80 || tail -80 pod-install.log)
            echo "## CocoaPods error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$error_text" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            error_text=${error_text//'%'/'%25'}
            error_text=${error_text//$'\r'/'%0D'}
            error_text=${error_text//$'\n'/'%0A'}
            echo "::error title=CocoaPods install failed::$error_text"
          fi

      - name: Build unsigned iOS release
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee ios-build.log

      - name: Package unsigned IPA
        run: |
          app_path=$(find build/ios -type d -name Runner.app -path '*iphoneos*' -print -quit)
          if [ -z "$app_path" ]; then
            echo "Runner.app was not found after the iOS build" >&2
            exit 1
          fi
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          ditto "$app_path" build/ios/ipa/Payload/Runner.app
          (cd build/ios/ipa && zip -qry JuheMusic-iOS-unsigned.ipa Payload)
          rm -rf build/ios/ipa/Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: JuheMusic-iOS-unsigned
          path: build/ios/ipa/JuheMusic-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Report iOS build failure
        if: failure()
        run: |
          if [ -f ios-build.log ]; then
            error_text=$(grep -E -A 12 -B 3 'error:|Error|Exception|BUILD FAILED|Failed to build' ios-build.log | tail -120 || tail -120 ios-build.log)
            echo "## iOS build error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$error_text" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            error_text=${error_text//'%'/'%25'}
            error_text=${error_text//$'\r'/'%0D'}
            error_text=${error_text//$'\n'/'%0A'}
            echo "::error title=iOS release build failed::$error_text"
          fi
