name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -o pipefail
          pod install 2>&1 | tee ../pod-install.log

      - name: Report CocoaPods failure
        if: failure()
        run: |
          if [ -f pod-install.log ]; then
            echo "## CocoaPods error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E -A 12 -B 3 '\[!\]|[Ee]rror|Exception' pod-install.log | tail -80 >> "$GITHUB_STEP_SUMMARY" || tail -80 pod-install.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
