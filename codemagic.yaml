workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Remove old broken platform files
        script: rm -rf ios
      - name: Recreate iOS project
        script: flutter create --platforms=ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS (ignore signing error)
        script: |
          flutter build ios --no-codesign --release 2>&1 || true
          APP=$(find /Users/builder/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Release-iphoneos/*" | head -1)
          mkdir -p build/ios/iphoneos
          cp -R "$APP" build/ios/iphoneos/Runner.app
    artifacts:
      - build/ios/iphoneos/Runner.app
