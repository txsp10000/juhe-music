workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup iOS project
        script: |
          rm -rf ios
          flutter create --platforms=ios .
          flutter pub get
      - name: Configure project
        script: |
          # Disable code signing in xcconfig (append, preserve Generated.xcconfig include)
          cat >> ios/Flutter/Release.xcconfig << 'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          cat >> ios/Flutter/Debug.xcconfig << 'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          # Disable code signing in pbxproj
          python3 -c '
          import re
          with open("ios/Runner.xcodeproj/project.pbxproj","r") as f:
            c = f.read()
          c = re.sub(r"DEVELOPMENT_TEAM = \"[^\"]*\";","DEVELOPMENT_TEAM = \"\";",c)
          c = re.sub(r"DEVELOPMENT_TEAM = [A-Z0-9]+;","DEVELOPMENT_TEAM = \"\";",c)
          c = re.sub(r"CODE_SIGN_STYLE = Automatic;","CODE_SIGN_STYLE = Manual;",c)
          c = re.sub(r"CODE_SIGN_IDENTITY = \"[^\"]*\";","CODE_SIGN_IDENTITY = \"\";",c)
          c = re.sub(r"PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\";","PROVISIONING_PROFILE_SPECIFIER = \"\";",c)
          with open("ios/Runner.xcodeproj/project.pbxproj","w") as f:
            f.write(c)
          '
          # Set app name
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 苗苗music" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 苗苗music" ios/Runner/Info.plist
          # Set app icon
          ICON_SRC="assets/icon.png"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            SIZES="20 29 40 58 60 76 80 87 120 152 167 180 1024"
            for SIZE in $SIZES; do
              sips -z $SIZE $SIZE "$ICON_SRC" --out "$ICON_DIR/Icon-App-${SIZE}x${SIZE}.png" >/dev/null 2>&1
            done
            cat > "$ICON_DIR/Contents.json" << 'ICONJSON'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"Icon-App-40x40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"Icon-App-60x60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-App-58x58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-App-87x87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-App-80x80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-App-180x180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-App-20x20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-App-29x29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-App-58x58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-App-80x80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-App-76x76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-App-152x152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"Icon-App-167x167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"Icon-App-1024x1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          ICONJSON
          fi
          # Enable background audio
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist 2>/dev/null
      - name: Build iOS (unsigned)
        script: |
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SYMROOT="../build/ios"
      - name: Package IPA
        script: |
          APP_PATH=$(find build/ios/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found!"
            exit 1
          fi
          echo "App: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          du -sh Runner.ipa
    artifacts:
      - Runner.ipa
