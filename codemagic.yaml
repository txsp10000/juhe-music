workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup Flutter project
        script: |
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Patch Podfile to disable codesigning for all targets
        script: |
          ruby << 'RUBY'
          content = File.read("ios/Podfile")
          code = <<~CODE
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          CODE
          last_end_idx = content.rindex("end")
          if last_end_idx
            content.insert(last_end_idx, code)
          end
          File.write("ios/Podfile", content)
          puts "Podfile patched successfully"
          RUBY

      - name: Install custom native files
        script: |
          cp ios_native/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ios_native/Runner.entitlements ios/Runner/Runner.entitlements

      - name: Configure Xcode project (ad-hoc signing)
        script: |
          ruby << 'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }

          target.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.miaomiao.music'
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
            # 使用 ad-hoc 签名 (-) 而不是完全禁用签名，这样 Xcode 才能产出有效二进制
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = '-'
            config.build_settings['DEVELOPMENT_TEAM'] = ''
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
            # 删除可能冲突的旧设置
            config.build_settings.delete('CODE_SIGNING_ALLOWED')
            config.build_settings.delete('CODE_SIGNING_REQUIRED')
          end

          project.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
          end

          runner_group = project.main_group.find_subpath('Runner', false)
          project.save
          puts "Xcode project configured (ad-hoc signing)"
          RUBY

      - name: Configure Info.plist
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 苗苗music" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 苗苗music" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$PLIST" 2>/dev/null || true

      - name: Generate app icons
        script: |
          ICON_SRC="assets/icon.png"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            for SIZE in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
              sips -z $SIZE $SIZE "$ICON_SRC" --out "$ICON_DIR/Icon-App-${SIZE}x${SIZE}.png" >/dev/null 2>&1
            done
            printf '%s\n' '{"images":[{"size":"20x20","idiom":"iphone","filename":"Icon-App-40x40.png","scale":"2x"},{"size":"20x20","idiom":"iphone","filename":"Icon-App-60x60.png","scale":"3x"},{"size":"29x29","idiom":"iphone","filename":"Icon-App-58x58.png","scale":"2x"},{"size":"29x29","idiom":"iphone","filename":"Icon-App-87x87.png","scale":"3x"},{"size":"40x40","idiom":"iphone","filename":"Icon-App-80x80.png","scale":"2x"},{"size":"40x40","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"3x"},{"size":"60x60","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"2x"},{"size":"60x60","idiom":"iphone","filename":"Icon-App-180x180.png","scale":"3x"},{"size":"20x20","idiom":"ipad","filename":"Icon-App-20x20.png","scale":"1x"},{"size":"20x20","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"2x"},{"size":"29x29","idiom":"ipad","filename":"Icon-App-29x29.png","scale":"1x"},{"size":"29x29","idiom":"ipad","filename":"Icon-App-58x58.png","scale":"2x"},{"size":"40x40","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"1x"},{"size":"40x40","idiom":"ipad","filename":"Icon-App-80x80.png","scale":"2x"},{"size":"76x76","idiom":"ipad","filename":"Icon-App-76x76.png","scale":"1x"},{"size":"76x76","idiom":"ipad","filename":"Icon-App-152x152.png","scale":"2x"},{"size":"83.5x83.5","idiom":"ipad","filename":"Icon-App-167x167.png","scale":"2x"},{"size":"1024x1024","idiom":"ios-marketing","filename":"Icon-App-1024x1024.png","scale":"1x"}],"info":{"version":1,"author":"xcode"}}' > "$ICON_DIR/Contents.json"
          fi

      - name: Build iOS
        script: |
          # 确保 pod install 已执行（flutter pub get 已在上一步完成）
          cd ios
          pod install
          cd ..

          # 直接使用 xcodebuild，绕过 flutter build 的证书检查
          # ad-hoc 签名 (CODE_SIGN_IDENTITY=-) 不需要 Apple 开发者证书
          echo "Running xcodebuild with ad-hoc signing..."
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/ios/Release-iphoneos" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build

          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: xcodebuild exited with code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

          echo "=== Verifying build output ==="
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            # 如果不在预期路径，尝试搜索
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: Runner.app not found after build"
              exit 1
            fi
          fi
          echo "App path: $APP_PATH"

          # 验证二进制文件存在且大小合理（至少 10MB，Flutter app 的 Release 二进制通常 20-50MB）
          BINARY="$APP_PATH/Runner"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            exit 1
          fi
          BINARY_SIZE=$(stat -f%z "$BINARY" 2>/dev/null || stat -c%s "$BINARY" 2>/dev/null || echo 0)
          echo "Binary size: $BINARY_SIZE bytes ($(echo "scale=1; $BINARY_SIZE/1048576" | bc)MB)"
          if [ "$BINARY_SIZE" -lt 10000000 ]; then
            echo "ERROR: Binary is too small ($BINARY_SIZE bytes). Build likely failed."
            exit 1
          fi

          # 验证 Frameworks
          FRAMEWORK_COUNT=$(find "$APP_PATH/Frameworks" -name "*.framework" -type d 2>/dev/null | wc -l)
          echo "Frameworks found: $FRAMEWORK_COUNT"
          if [ "$FRAMEWORK_COUNT" -eq 0 ]; then
            echo "ERROR: No frameworks in .app bundle"
            exit 1
          fi
          echo "=== Build verified successfully ==="

      - name: Package IPA (TrollStore ready)
        script: |
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: .app not found"
              exit 1
            fi
          fi
          BINARY="$APP_PATH/Runner"

          echo "Found app: $APP_PATH"

          # 重新验证二进制
          BINARY_SIZE=$(stat -f%z "$BINARY" 2>/dev/null || stat -c%s "$BINARY" 2>/dev/null || echo 0)
          echo "Binary: $BINARY ($(echo "scale=1; $BINARY_SIZE/1048576" | bc)MB)"

          # Sign frameworks with ad-hoc
          echo "Signing frameworks..."
          find "$APP_PATH/Frameworks" -name "*.framework" -type d | while read fw; do
            codesign --force --sign - "$fw" 2>/dev/null || echo "  Warning: failed to sign $fw"
          done

          # Sign main binary with entitlements (ad-hoc for TrollStore)
          echo "Signing main binary with entitlements..."
          codesign --force --sign - --entitlements ios_native/Runner.entitlements "$BINARY"
          if [ $? -ne 0 ]; then
            echo "ERROR: codesign failed"
            exit 1
          fi
          echo "Signed successfully"

          # Verify entitlements
          echo "=== Entitlements ==="
          codesign -d --entitlements - "$BINARY" 2>&1 || true
          echo "==================="

          # Package
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          IPA_SIZE=$(du -sh Runner.ipa | cut -f1)
          echo "IPA created: $IPA_SIZE"

    artifacts:
      - Runner.ipa
