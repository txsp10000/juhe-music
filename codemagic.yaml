workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Remove old broken platform files
        script: rm -rf ios
      - name: Recreate iOS project
        script: flutter create --platforms=ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build with xcodebuild directly
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=NO CONFIGURATION_BUILD_DIR=../build/ios/iphoneos build
    artifacts:
      - build/ios/iphoneos/Runner.app
