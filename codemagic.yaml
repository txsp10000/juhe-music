workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Recreate platform files
        script: flutter create --platforms=ios .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS without signing
        script: flutter build ios --no-codesign --release
    artifacts:
      - build/ios/iphoneos/Runner.app
