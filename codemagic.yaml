workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      # iOS 26.4 SDK 禁止编译期无签名/adhoc 签名，固定使用 Xcode 16.2 的旧 SDK
      xcode: "16.2"
      cocoapods: default
    triggering:
      events: []
      # 自动构建已关闭，需手动触发
      # branch_patterns:
      #   - pattern: main
      #     include: true
    scripts:
      - name: Setup Flutter project
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Install custom native files
        script: |
          cp ios_native/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ios_native/Runner.entitlements ios/Runner/Runner.entitlements

      - name: Validate Xcode project
        script: |
          # xcodeproj/nanaimo rejects a UTF-8 BOM before the pbxproj header.
          ruby -e 'path="ios/Runner.xcodeproj/project.pbxproj"; data=File.binread(path); File.binwrite(path, data.delete_prefix("\xEF\xBB\xBF".b))'
          test -f ios/Flutter/AppFrameworkInfo.plist
          test -f ios/Flutter/Debug.xcconfig
          test -f ios/Flutter/Release.xcconfig
          test -f ios/Runner/CarPlaySceneDelegate.swift
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme

      - name: Configure Info.plist
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 音乐" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 音乐" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: Build iOS
        script: |
          # 确保 pod install 已执行（flutter pub get 已在上一步完成）
          cd ios
          pod install
          cd ..

          # 直接使用 xcodebuild，绕过 flutter build 的证书检查
          # iOS 26.4 SDK 禁止编译期 CODE_SIGN_IDENTITY=-，改用完全禁用编译期签名
          # 编译完成后在 Package 步骤手动 codesign
          echo "Running xcodebuild (no signing during build)..."
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/ios/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: xcodebuild exited with code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

          echo "=== Verifying build output ==="
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            # 如果不在预期路径，尝试搜索
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: Runner.app not found after build"
              exit 1
            fi
          fi
          echo "App path: $APP_PATH"

          # 验证二进制文件存在（Flutter 的 Runner 仅为薄壳 ~160KB，核心代码在 Frameworks 中）
          BINARY="$APP_PATH/Runner"
          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Binary not found at $BINARY"
            exit 1
          fi
          BINARY_SIZE=$(stat -f%z "$BINARY" 2>/dev/null || stat -c%s "$BINARY" 2>/dev/null || echo 0)
          echo "Runner binary: $BINARY_SIZE bytes ($(echo "scale=1; $BINARY_SIZE/1048576" | bc)MB)"

          # 验证 App.framework（包含 Dart AOT 编译代码）
          if [ ! -d "$APP_PATH/Frameworks/App.framework" ]; then
            echo "ERROR: App.framework not found - Dart AOT compilation may have failed"
            exit 1
          fi

          # 验证 Flutter.framework（Flutter 引擎）
          if [ ! -d "$APP_PATH/Frameworks/Flutter.framework" ]; then
            echo "ERROR: Flutter.framework not found"
            exit 1
          fi

          # 验证总 .app 大小（Flutter 完整包应 ≥ 15MB）
           APP_SIZE=$(du -sk "$APP_PATH" | cut -f1)
           APP_SIZE_MB=$((APP_SIZE / 1024))
           echo "App total size: ${APP_SIZE_MB}MB"
           if [ "$APP_SIZE" -lt 15000 ]; then
            echo "ERROR: .app is too small (${APP_SIZE_MB}MB). Frameworks may be incomplete."
            exit 1
          fi

          # 列出所有 Frameworks
          echo "Frameworks:"
          ls "$APP_PATH/Frameworks/" 2>/dev/null
          echo "=== Build verified successfully ==="

      - name: Package IPA (TrollStore ready)
        script: |
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Runner.app" -type d 2>/dev/null | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: .app not found"
              exit 1
            fi
          fi
          BINARY="$APP_PATH/Runner"

          echo "Found app: $APP_PATH"

          # 重新验证二进制
          BINARY_SIZE=$(stat -f%z "$BINARY" 2>/dev/null || stat -c%s "$BINARY" 2>/dev/null || echo 0)
          echo "Binary: $BINARY ($(echo "scale=1; $BINARY_SIZE/1048576" | bc)MB)"

          # Sign frameworks with ad-hoc
          echo "Signing frameworks..."
          find "$APP_PATH/Frameworks" -name "*.framework" -type d | while read fw; do
            codesign --force --sign - "$fw" 2>/dev/null || echo "  Warning: failed to sign $fw"
          done

          # Sign main binary with entitlements (ad-hoc for TrollStore)
          echo "Signing main binary with entitlements..."
          codesign --force --sign - --entitlements ios_native/Runner.entitlements "$BINARY"
          if [ $? -ne 0 ]; then
            echo "ERROR: codesign failed"
            exit 1
          fi
          echo "Signed successfully"

          # Verify entitlements
          echo "=== Entitlements ==="
          codesign -d --entitlements - "$BINARY" 2>&1 || true
          echo "==================="

          # Package
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          IPA_SIZE=$(du -sh Runner.ipa | cut -f1)
          echo "IPA created: $IPA_SIZE"

    artifacts:
      - Runner.ipa
