workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup Flutter project
        script: |
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Patch Podfile to disable codesigning for all targets
        script: |
          # Flutter Podfile already has post_install - inject our code before its last 'end'
          ruby -e '
            content = File.read("ios/Podfile")
            inject = "  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n    end\n  end\n"
            content.sub!(/^end\s*\Z/m, inject + "end")
            File.write("ios/Podfile", content)
            puts "Podfile patched"
          '
      - name: Install custom native files
        script: |
          cp ios_native/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ios_native/CarPlaySceneDelegate.swift ios/Runner/CarPlaySceneDelegate.swift
          cp ios_native/Runner.entitlements ios/Runner/Runner.entitlements

      - name: Configure Xcode project with Ruby (xcodeproj gem)
        script: |
          ruby << 'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }

          # 1. Set bundle identifier
          target.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.miaomiao.music'
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
          end

          # Also set project-level deployment target
          project.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
          end

          # 2. Add CarPlaySceneDelegate.swift to project
          runner_group = project.main_group.find_subpath('Runner', false)
          unless runner_group.files.any? { |f| f.path == 'CarPlaySceneDelegate.swift' }
            file_ref = runner_group.new_file('CarPlaySceneDelegate.swift')
            target.source_build_phase.add_file_reference(file_ref)
            puts "Added CarPlaySceneDelegate.swift to project and sources"
          end

          project.save
          puts "Xcode project configured successfully"
          RUBY

      - name: Configure Info.plist
        script: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 苗苗music" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 苗苗music" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication array" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0 dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneConfigurationName string CarPlay" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneDelegateClassName string Runner.CarPlaySceneDelegate" "$PLIST" 2>/dev/null

      - name: Generate app icons
        script: |
          ICON_SRC="assets/icon.png"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            for SIZE in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
              sips -z $SIZE $SIZE "$ICON_SRC" --out "$ICON_DIR/Icon-App-${SIZE}x${SIZE}.png" >/dev/null 2>&1
            done
            printf '%s\n' '{"images":[{"size":"20x20","idiom":"iphone","filename":"Icon-App-40x40.png","scale":"2x"},{"size":"20x20","idiom":"iphone","filename":"Icon-App-60x60.png","scale":"3x"},{"size":"29x29","idiom":"iphone","filename":"Icon-App-58x58.png","scale":"2x"},{"size":"29x29","idiom":"iphone","filename":"Icon-App-87x87.png","scale":"3x"},{"size":"40x40","idiom":"iphone","filename":"Icon-App-80x80.png","scale":"2x"},{"size":"40x40","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"3x"},{"size":"60x60","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"2x"},{"size":"60x60","idiom":"iphone","filename":"Icon-App-180x180.png","scale":"3x"},{"size":"20x20","idiom":"ipad","filename":"Icon-App-20x20.png","scale":"1x"},{"size":"20x20","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"2x"},{"size":"29x29","idiom":"ipad","filename":"Icon-App-29x29.png","scale":"1x"},{"size":"29x29","idiom":"ipad","filename":"Icon-App-58x58.png","scale":"2x"},{"size":"40x40","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"1x"},{"size":"40x40","idiom":"ipad","filename":"Icon-App-80x80.png","scale":"2x"},{"size":"76x76","idiom":"ipad","filename":"Icon-App-76x76.png","scale":"1x"},{"size":"76x76","idiom":"ipad","filename":"Icon-App-152x152.png","scale":"2x"},{"size":"83.5x83.5","idiom":"ipad","filename":"Icon-App-167x167.png","scale":"2x"},{"size":"1024x1024","idiom":"ios-marketing","filename":"Icon-App-1024x1024.png","scale":"1x"}],"info":{"version":1,"author":"xcode"}}' > "$ICON_DIR/Contents.json"
          fi

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA with entitlements
        script: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          echo "Frameworks:"
          ls "$APP_PATH/Frameworks/" 2>/dev/null || echo "  (none)"

          # Sign with entitlements using codesign (ad-hoc) for TrollStore
          # First sign all frameworks
          find "$APP_PATH/Frameworks" -name "*.framework" -type d | while read fw; do
            codesign --force --sign - "$fw" 2>/dev/null || true
          done

          # Sign main binary with CarPlay entitlements
          codesign --force --sign - --entitlements ios_native/Runner.entitlements "$APP_PATH/Runner"
          echo "Signed with entitlements via codesign"

          # Verify entitlements
          echo "=== Entitlements ==="
          codesign -d --entitlements - "$APP_PATH/Runner" 2>&1 || true
          echo "==================="

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          du -sh Runner.ipa

    artifacts:
      - Runner.ipa

