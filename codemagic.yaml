workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Setup Flutter and recreate iOS project
        script: |
          flutter config --no-enable-swift-package-manager
          rm -rf ios
          flutter create --platforms=ios .
          flutter pub get

      - name: Install custom native files and Podfile
        script: |
          # Copy custom Swift files
          cp ios_native/AppDelegate.swift ios/Runner/AppDelegate.swift
          cp ios_native/CarPlaySceneDelegate.swift ios/Runner/CarPlaySceneDelegate.swift
          cp ios_native/Runner.entitlements ios/Runner/Runner.entitlements

          # Overwrite Podfile with correct platform version
          cat > ios/Podfile << 'PODFILE'
platform :ios, '14.0'

target 'Runner' do
  use_frameworks!
  use_modular_headers!

  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))

  target 'RunnerTests' do
    inherit! :search_paths
  end
end

post_install do |installer|
  installer.pods_project.targets.each do |target|
    flutter_additional_ios_build_settings(target)
  end
end
PODFILE

      - name: Configure Xcode project
        script: |
          python3 << 'PYTHON'
          import re

          pbx_path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx_path, "r") as f:
              c = f.read()

          # --- 1. Bundle identifier ---
          c = re.sub(
              r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;",
              "PRODUCT_BUNDLE_IDENTIFIER = com.miaomiao.music;",
              c
          )

          # --- 2. Disable code signing ---
          c = re.sub(r'DEVELOPMENT_TEAM = "[^"]*";', 'DEVELOPMENT_TEAM = "";', c)
          c = re.sub(r"DEVELOPMENT_TEAM = [A-Z0-9]+;", 'DEVELOPMENT_TEAM = "";', c)
          c = re.sub(r"CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", c)
          c = re.sub(r'CODE_SIGN_IDENTITY = "[^"]*";', 'CODE_SIGN_IDENTITY = "";', c)
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', 'PROVISIONING_PROFILE_SPECIFIER = "";', c)

          # --- 3. Set deployment target to 14.0 ---
          c = re.sub(r"IPHONEOS_DEPLOYMENT_TARGET = [^;]+;", "IPHONEOS_DEPLOYMENT_TARGET = 14.0;", c)

          # --- 4. Add CODE_SIGN_ENTITLEMENTS ---
          if "CODE_SIGN_ENTITLEMENTS" not in c:
              c = re.sub(
                  r"(ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;)",
                  r"\1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;",
                  c
              )

          # --- 5. Add CarPlaySceneDelegate.swift + CarPlay.framework ---
          if "CarPlaySceneDelegate" not in c:
              file_ref = '\t\tCARP00000001 /* CarPlaySceneDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = CarPlaySceneDelegate.swift; sourceTree = "<group>"; };'
              fw_ref = '\t\tCARP00000002 /* CarPlay.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = CarPlay.framework; path = System/Library/Frameworks/CarPlay.framework; sourceTree = SDKROOT; };'
              build_src = '\t\tCARP00000003 /* CarPlaySceneDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = CARP00000001 /* CarPlaySceneDelegate.swift */; };'
              build_fw = '\t\tCARP00000004 /* CarPlay.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = CARP00000002 /* CarPlay.framework */; };'

              c = c.replace(
                  "/* End PBXFileReference section */",
                  file_ref + "\n" + fw_ref + "\n/* End PBXFileReference section */"
              )
              c = c.replace(
                  "/* End PBXBuildFile section */",
                  build_src + "\n" + build_fw + "\n/* End PBXBuildFile section */"
              )
              c = re.sub(
                  r"(/\* Sources \*/ = \{[^}]*files = \()",
                  r"\1\n\t\t\t\tCARP00000003 /* CarPlaySceneDelegate.swift in Sources */,",
                  c
              )
              c = re.sub(
                  r"(AppDelegate\.swift \*/,)",
                  r"\1\n\t\t\t\tCARP00000001 /* CarPlaySceneDelegate.swift */,",
                  c
              )

              if "PBXFrameworksBuildPhase" not in c:
                  fw_phase = (
                      "/* Begin PBXFrameworksBuildPhase section */\n"
                      "\t\tCARP00000005 /* Frameworks */ = {\n"
                      "\t\t\tisa = PBXFrameworksBuildPhase;\n"
                      "\t\t\tbuildActionMask = 2147483647;\n"
                      "\t\t\tfiles = (\n"
                      "\t\t\t\tCARP00000004 /* CarPlay.framework in Frameworks */,\n"
                      "\t\t\t);\n"
                      "\t\t\trunOnlyForDeploymentPostprocessing = 0;\n"
                      "\t\t};\n"
                      "/* End PBXFrameworksBuildPhase section */"
                  )
                  c = c.replace(
                      "/* End PBXSourcesBuildPhase section */",
                      "/* End PBXSourcesBuildPhase section */\n" + fw_phase
                  )
                  c = re.sub(
                      r"(/\* Sources \*/ \*/,)",
                      r"\1\n\t\t\t\tCARP00000005 /* Frameworks */,",
                      c
                  )
              else:
                  c = re.sub(
                      r"(isa = PBXFrameworksBuildPhase;[^}]*files = \()",
                      r"\1\n\t\t\t\tCARP00000004 /* CarPlay.framework in Frameworks */,",
                      c
                  )

          with open(pbx_path, "w") as f:
              f.write(c)

          print("Xcode project configured successfully")
          PYTHON

      - name: Configure Info.plist
        script: |
          PLIST="ios/Runner/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 苗苗music" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 苗苗music" "$PLIST"

          # Background audio
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null

          # Allow HTTP
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null

          # CarPlay scene
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication array" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0 dict" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneConfigurationName string CarPlay" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneDelegateClassName string Runner.CarPlaySceneDelegate" "$PLIST" 2>/dev/null

      - name: Generate app icons
        script: |
          ICON_SRC="assets/icon.png"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            for SIZE in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
              sips -z $SIZE $SIZE "$ICON_SRC" --out "$ICON_DIR/Icon-App-${SIZE}x${SIZE}.png" >/dev/null 2>&1
            done
            cat > "$ICON_DIR/Contents.json" << 'ICONJSON'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"Icon-App-40x40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"Icon-App-60x60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-App-58x58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-App-87x87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-App-80x80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-App-180x180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-App-20x20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-App-29x29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-App-58x58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-App-80x80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-App-76x76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-App-152x152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"Icon-App-167x167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"Icon-App-1024x1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          ICONJSON
          fi

      - name: Disable signing in xcconfig
        script: |
          for CFG in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            echo "" >> "$CFG"
            cat >> "$CFG" << 'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          done

      - name: Build iOS
        script: |
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath ../build/ios

      - name: Package IPA
        script: |
          APP_PATH=""
          for DIR in build/ios/Build/Products/Release-iphoneos build/ios/Release-iphoneos build/ios/iphoneos; do
            FOUND=$(find "$DIR" -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then APP_PATH="$FOUND"; break; fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find build/ios -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Ensure Frameworks are embedded (critical for TrollStore)
          if [ ! -d "$APP_PATH/Frameworks" ]; then
            echo "WARNING: Frameworks directory missing, searching for frameworks to embed..."
            mkdir -p "$APP_PATH/Frameworks"
            # Find and copy Flutter.framework and App.framework
            find build/ios -name "Flutter.framework" -type d | head -1 | xargs -I{} cp -R {} "$APP_PATH/Frameworks/"
            find build/ios -name "App.framework" -type d | head -1 | xargs -I{} cp -R {} "$APP_PATH/Frameworks/"
            # Copy any pod frameworks
            PODS_FW_DIR=$(find build/ios -path "*/Release-iphoneos/*.framework" -type d 2>/dev/null | head -1 | xargs -I{} dirname {})
            if [ -n "$PODS_FW_DIR" ] && [ -d "$PODS_FW_DIR" ]; then
              find "$PODS_FW_DIR" -name "*.framework" -type d -exec cp -R {} "$APP_PATH/Frameworks/" \;
            fi
          fi

          # List what's in Frameworks for debugging
          echo "Frameworks in app bundle:"
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "  (none)"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          du -sh Runner.ipa

    artifacts:
      - Runner.ipa

