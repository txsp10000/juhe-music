workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Disable code signing
        script: |
          cd ios
          ruby -e '
            path = "Runner.xcodeproj/project.pbxproj"
            content = File.read(path)
            content.gsub!(/CODE_SIGN_IDENTITY = ".*?"/, "CODE_SIGN_IDENTITY = \"\"")
            content.gsub!(/CODE_SIGN_IDENTITY = .*?;/, "CODE_SIGN_IDENTITY = \"\";")
            content.gsub!(/DEVELOPMENT_TEAM = .*?;/, "DEVELOPMENT_TEAM = \"\";")
            content.gsub!(/CODE_SIGNING_REQUIRED = YES/, "CODE_SIGNING_REQUIRED = NO")
            content.gsub!(/CODE_SIGNING_ALLOWED = YES/, "CODE_SIGNING_ALLOWED = NO")
            content.gsub!(/PROVISIONING_PROFILE_SPECIFIER = .*?;/, "PROVISIONING_PROFILE_SPECIFIER = \"\";")
            File.write(path, content)
          '
          mkdir -p Flutter
          echo 'CODE_SIGNING_ALLOWED = NO' > Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED = NO' >> Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY = ' >> Flutter/Release.xcconfig
      - name: Set app display name
        script: |
          sed -i '' 's/PRODUCT_NAME = .*/PRODUCT_NAME = "苗苗music";/' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 苗苗music" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 苗苗music" ios/Runner/Info.plist
      - name: Set app icon
        script: |
          ICON_SRC="assets/icon.png"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            SIZES="20 29 40 58 60 76 80 87 120 152 167 180 1024"
            for SIZE in $SIZES; do
              sips -z $SIZE $SIZE "$ICON_SRC" --out "$ICON_DIR/Icon-App-${SIZE}x${SIZE}.png" >/dev/null 2>&1
            done
            cat > "$ICON_DIR/Contents.json" << 'ICONJSON'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","filename":"Icon-App-40x40.png","scale":"2x"},
              {"size":"20x20","idiom":"iphone","filename":"Icon-App-60x60.png","scale":"3x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-App-58x58.png","scale":"2x"},
              {"size":"29x29","idiom":"iphone","filename":"Icon-App-87x87.png","scale":"3x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-App-80x80.png","scale":"2x"},
              {"size":"40x40","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"3x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-App-120x120.png","scale":"2x"},
              {"size":"60x60","idiom":"iphone","filename":"Icon-App-180x180.png","scale":"3x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-App-20x20.png","scale":"1x"},
              {"size":"20x20","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"2x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-App-29x29.png","scale":"1x"},
              {"size":"29x29","idiom":"ipad","filename":"Icon-App-58x58.png","scale":"2x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-App-40x40.png","scale":"1x"},
              {"size":"40x40","idiom":"ipad","filename":"Icon-App-80x80.png","scale":"2x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-App-76x76.png","scale":"1x"},
              {"size":"76x76","idiom":"ipad","filename":"Icon-App-152x152.png","scale":"2x"},
              {"size":"83.5x83.5","idiom":"ipad","filename":"Icon-App-167x167.png","scale":"2x"},
              {"size":"1024x1024","idiom":"ios-marketing","filename":"Icon-App-1024x1024.png","scale":"1x"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          ICONJSON
            echo "App icon set generated successfully"
          fi
      - name: Enable background audio
        script: |
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS without signing
        script: flutter build ios --release --no-codesign
      - name: Package as IPA
        script: |
          echo "=== Finding .app ==="
          find build/ios/iphoneos -name "*.app" -type d 2>/dev/null
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found!"
            exit 1
          fi
          echo "Using: $APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r Runner.ipa Payload
          du -sh Runner.ipa
    artifacts:
      - Runner.ipa
