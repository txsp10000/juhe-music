name: ios_music
description: 苗苗music - Flutter cross-platform music app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  media_kit: ^1.2.6
  media_kit_libs_ios_audio: ^1.0.4
  media_kit_libs_android_audio: ^1.3.0
  audio_service: ^0.18.12
  path_provider: ^2.1.1
  connectivity_plus: ^5.0.2
  palette_generator: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
